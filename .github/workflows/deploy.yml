# Continuous deployment — Azure Container Apps.
#
# Runs after CI succeeds on main (or by hand), builds ONLY the services whose
# source changed with `az acr build`, and points the Container App at the new
# image. It never touches secrets or env vars: those are owned by
# infra/azure/deploy.sh. Use that script for anything that is not "ship the
# latest commit" (first deploy, secret rotation, new env vars, migrations).
#
# OFF BY DEFAULT. It does nothing until the repository variable
# AZURE_DEPLOY_ENABLED is set to 'true' and the Azure OIDC secrets exist — see
# docs/DEPLOYMENT-AZURE.md § "CD from GitHub Actions". Switched on 2026-10-10 by
# infra/azure/setup-github-oidc.sh.
#
# Why the Supabase check below exists: NEXT_PUBLIC_* are compiled into the web
# bundle. A web image built without them has sign-in silently switched off
# (production, 2026-10-03). The job fails rather than ship that.

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      services:
        description: 'Space-separated subset of: web api agent (blank = whatever changed)'
        required: false
        default: ''

concurrency:
  group: deploy-production
  cancel-in-progress: false # never abandon a half-finished rollout

permissions:
  contents: read
  id-token: write # OIDC to Azure, no stored client secret

# Deployment-specific names live in repository variables (Settings → Secrets
# and variables → Actions → Variables), not in this public file:
#   ACR_NAME   the container registry name (az acr list -o table)
#   API_URL    the api Container App's https URL, baked into the web image as
#              NEXT_PUBLIC_API_URL
env:
  ACR_NAME: ${{ vars.ACR_NAME }}
  RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP || 'quantum-lab-rg' }}
  PUBLIC_URL: https://qubit16.ai
  API_URL: ${{ vars.API_URL }}

jobs:
  deploy:
    name: Build and roll out changed services
    if: >-
      vars.AZURE_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - name: Check the deployment variables are set
        run: |
          if [ -z "$ACR_NAME" ] || [ -z "$API_URL" ]; then
            echo "::error::Set the ACR_NAME and API_URL repository variables (see the header of this workflow)."; exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      # Logged in BEFORE planning: the plan compares each service with the
      # commit its live image was built from, which needs a read of Azure.
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Decide what to deploy
        id: plan
        env:
          REQUESTED: ${{ inputs.services }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED// /}" ]; then
            list="$REQUESTED"
          else
            # Compare each service with the commit its LIVE image was built from
            # (the image tag is gh-<first 12 chars of the SHA>), not with HEAD~1.
            # HEAD~1 misses every earlier commit of a multi-commit push, and a
            # push whose CI run was cancelled by a newer push never deploys at
            # all, so its changes would otherwise stay undeployed for good.
            #
            # Safe fallback: whenever the live commit cannot be established
            # (image not built by this workflow, tag unreadable, commit not in
            # this clone) that service is deployed. Over-deploying is harmless;
            # leaving production stale is not. A live commit that is already
            # at or ahead of HEAD (a re-run of an older CI run) is left alone
            # rather than rolled backwards.
            patterns_web='^(apps/web/|packages/|package(-lock)?\.json)'
            patterns_api='^services/api/'
            patterns_agent='^services/agent/'
            list=""
            for svc in web api agent; do
              pattern_var="patterns_$svc"
              live_tag="$(az containerapp show -n "quantum-lab-$svc" -g "$RESOURCE_GROUP" \
                --query 'properties.template.containers[0].image' -o tsv 2>/dev/null | sed -n 's/.*:gh-\([0-9a-f]\{12\}\)$/\1/p' || true)"
              live=""
              if [ -n "$live_tag" ]; then
                live="$(git rev-parse --verify --quiet "${live_tag}^{commit}" 2>/dev/null || true)"
              fi
              if [ -z "$live" ]; then
                echo "$svc: live commit unknown, deploying"
                list="$list $svc"; continue
              fi
              if git merge-base --is-ancestor "$HEAD_SHA" "$live" 2>/dev/null; then
                echo "$svc: live ${live:0:12} is at or ahead of ${HEAD_SHA:0:12}, nothing to do"; continue
              fi
              if ! git merge-base --is-ancestor "$live" "$HEAD_SHA" 2>/dev/null; then
                echo "$svc: live ${live:0:12} is not an ancestor of ${HEAD_SHA:0:12}, deploying"
                list="$list $svc"; continue
              fi
              changed="$(git diff --name-only "$live" "$HEAD_SHA")"
              if grep -qE "${!pattern_var}" <<<"$changed"; then
                echo "$svc: changed since live ${live:0:12}, deploying"
                list="$list $svc"
              else
                echo "$svc: unchanged since live ${live:0:12}"
              fi
            done
          fi
          echo "services=${list# }" >> "$GITHUB_OUTPUT"
          echo "Deploying: ${list:-nothing}"

      - name: Refuse a web build with sign-in switched off
        if: contains(steps.plan.outputs.services, 'web')
        env:
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON" ]; then
            echo "::error::Repository variables NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY are empty; the web image would ship with accounts off."
            exit 1
          fi

      - name: Build and roll out
        if: steps.plan.outputs.services != ''
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          TRIAL_DAYS: ${{ vars.NEXT_PUBLIC_LAUNCH_TRIAL_DAYS }}
          TRIAL_UNTIL: ${{ vars.NEXT_PUBLIC_LAUNCH_TRIAL_UNTIL }}
          ANALYTICS_ENDPOINT: ${{ vars.NEXT_PUBLIC_ANALYTICS_ENDPOINT }}
          DEVICE_TUTOR: ${{ vars.NEXT_PUBLIC_DEVICE_TUTOR }}
        run: |
          set -euo pipefail
          tag="gh-${SHA::12}"
          registry="$ACR_NAME.azurecr.io"
          for svc in ${{ steps.plan.outputs.services }}; do
            case "$svc" in
              web)
                az acr build -r "$ACR_NAME" -g "$RESOURCE_GROUP" -t "quantum-lab/web:$tag" -f apps/web/Dockerfile \
                  --build-arg "NEXT_PUBLIC_APP_URL=$PUBLIC_URL" --build-arg "NEXT_PUBLIC_API_URL=$API_URL" \
                  --build-arg "NEXT_PUBLIC_SUPABASE_URL=$SUPABASE_URL" --build-arg "NEXT_PUBLIC_SUPABASE_ANON_KEY=$SUPABASE_ANON" \
                  --build-arg "NEXT_PUBLIC_SENTRY_DSN=$SENTRY_DSN" --build-arg "NEXT_PUBLIC_LAUNCH_TRIAL_DAYS=$TRIAL_DAYS" \
                  --build-arg "NEXT_PUBLIC_LAUNCH_TRIAL_UNTIL=$TRIAL_UNTIL" --build-arg "NEXT_PUBLIC_ANALYTICS_ENDPOINT=$ANALYTICS_ENDPOINT" \
                  --build-arg "NEXT_PUBLIC_DEVICE_TUTOR=$DEVICE_TUTOR" \
                  --build-arg "NEXT_PUBLIC_SENTRY_RELEASE=$SHA" --build-arg "NEXT_PUBLIC_BUILD_STAMP=${SHA::12}" . ;;
              api)   az acr build -r "$ACR_NAME" -g "$RESOURCE_GROUP" -t "quantum-lab/api:$tag"   -f services/api/Dockerfile   services/api ;;
              agent) az acr build -r "$ACR_NAME" -g "$RESOURCE_GROUP" -t "quantum-lab/agent:$tag" -f services/agent/Dockerfile services/agent ;;
              *) echo "::error::unknown service $svc"; exit 1 ;;
            esac
            az containerapp update -n "quantum-lab-$svc" -g "$RESOURCE_GROUP" --image "$registry/quantum-lab/$svc:$tag" >/dev/null
            echo "rolled out $svc -> $tag"
          done

      - name: Smoke test
        if: steps.plan.outputs.services != ''
        run: |
          set -euo pipefail
          # The hard check is Azure's own view of the rollout: the latest
          # revision of each app must be Running and Healthy. The origins only
          # accept Cloudflare's addresses (infra/azure/restrict-origin-to-cloudflare.sh)
          # and Cloudflare's bot protection may answer 403 to a curl from a
          # runner IP, so every HTTP probe below is advisory.
          for svc in ${{ steps.plan.outputs.services }}; do
            ok=0
            for attempt in $(seq 1 20); do
              read -r health running <<<"$(az containerapp revision list -n "quantum-lab-$svc" -g "$RESOURCE_GROUP" \
                --query 'sort_by([?properties.active], &properties.createdTime)[-1].[properties.healthState, properties.runningState]' -o tsv | tr '\n' ' ')"
              if [ "$health" = Healthy ] && [[ "$running" == Running* ]]; then ok=1; break; fi
              echo "  $svc: $health / $running (attempt $attempt)"; sleep 15
            done
            [ "$ok" = 1 ] || { echo "::error::$svc: latest revision is $health / $running"; exit 1; }
            echo "healthy: $svc (latest revision Healthy, $running)"
          done
          ua='Mozilla/5.0 (qubit16 deploy smoke test)'
          if curl -fsS -A "$ua" "$PUBLIC_URL/account" | grep -q "NEXT_PUBLIC_SUPABASE_URL"; then
            echo "::error::/account is in no-accounts mode — Supabase vars missing from the build"; exit 1
          fi
          if echo "${{ steps.plan.outputs.services }}" | grep -qw agent; then
            curl -fsS -A "$ua" "$PUBLIC_URL/api/agent" | grep -q '"source"' \
              && echo "public: $PUBLIC_URL/api/agent answers" \
              || echo "::warning::$PUBLIC_URL/api/agent did not answer from the runner"
          fi
          code="$(curl -s -o /dev/null -w '%{http_code}' -A "$ua" "$PUBLIC_URL/api/health" || true)"
          case "$code" in
            200) echo "public: $PUBLIC_URL/api/health -> 200" ;;
            403) echo "::warning::$PUBLIC_URL answered 403 to the runner (Cloudflare bot protection); the revision checks above passed" ;;
            *)   echo "::warning::$PUBLIC_URL/api/health answered $code from the runner; the revision checks above passed" ;;
          esac
